<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <!-- Wood grain -->
    <radialGradient id="wood" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d9a96d"/>
      <stop offset="100%" stop-color="#8b5a2b"/>
    </radialGradient>

    <!-- Metal -->
    <radialGradient id="metal" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f0f0f0"/>
      <stop offset="60%" stop-color="#b8b8b8"/>
      <stop offset="100%" stop-color="#666666"/>
    </radialGradient>

    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>

    <!-- Clip to shield -->
    <clipPath id="shieldClip">
      <circle cx="400" cy="400" r="330"/>
    </clipPath>
  </defs>

  <!-- Shield -->
  <g filter="url(#shadow)">
    <!-- Outer rim -->
    <circle
      cx="400"
      cy="400"
      r="340"
      fill="#4a2d14"
      stroke="#2d1a0a"
      stroke-width="8"/>

    <!-- Wood base -->
    <circle
      cx="400"
      cy="400"
      r="320"
      fill="url(#wood)"/>

    <!-- Painted quarters -->
    <g clip-path="url(#shieldClip)">
      <path d="M400 400 L400 80 A320 320 0 0 1 720 400 Z"
            fill="#b11f1f"/>
      <path d="M400 400 L720 400 A320 320 0 0 1 400 720 Z"
            fill="#e9d8a6"/>
      <path d="M400 400 L400 720 A320 320 0 0 1 80 400 Z"
            fill="#1e5b8a"/>
      <path d="M400 400 L80 400 A320 320 0 0 1 400 80 Z"
            fill="#e9d8a6"/>

      <!-- Wood grain -->
      <g opacity="0.12" stroke="#5f3a1c" stroke-width="3" fill="none">
        <circle cx="400" cy="400" r="70"/>
        <circle cx="400" cy="400" r="110"/>
        <circle cx="400" cy="400" r="150"/>
        <circle cx="400" cy="400" r="190"/>
        <circle cx="400" cy="400" r="230"/>
        <circle cx="400" cy="400" r="270"/>
      </g>
    </g>

    <!-- Metal ring -->
    <circle
      cx="400"
      cy="400"
      r="320"
      fill="none"
      stroke="#9a7845"
      stroke-width="10"/>

    <!-- Rivets -->
    <g fill="#d4d4d4" stroke="#666" stroke-width="2">
      <circle cx="400" cy="80" r="8"/>
      <circle cx="560" cy="123" r="8"/>
      <circle cx="677" cy="240" r="8"/>
      <circle cx="720" cy="400" r="8"/>
      <circle cx="677" cy="560" r="8"/>
      <circle cx="560" cy="677" r="8"/>
      <circle cx="400" cy="720" r="8"/>
      <circle cx="240" cy="677" r="8"/>
      <circle cx="123" cy="560" r="8"/>
      <circle cx="80" cy="400" r="8"/>
      <circle cx="123" cy="240" r="8"/>
      <circle cx="240" cy="123" r="8"/>
    </g>

    <!-- Boss -->
    <circle
      cx="400"
      cy="400"
      r="75"
      fill="url(#metal)"
      stroke="#555"
      stroke-width="5"/>

    <!-- Boss highlight -->
    <ellipse
      cx="380"
      cy="370"
      rx="28"
      ry="18"
      fill="white"
      opacity="0.35"/>

    <!-- Decorative cross -->
    <g stroke="#caa25f" stroke-width="12" stroke-linecap="round" opacity="0.85">
      <line x1="400" y1="120" x2="400" y2="680"/>
      <line x1="120" y1="400" x2="680" y2="400"/>
    </g>

    <!-- Inner outline -->
    <circle
      cx="400"
      cy="400"
      r="320"
      fill="none"
      stroke="#3a2411"
      stroke-width="3"/>
  </g>
</svg>
