<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="./assets/images/vikingIcon.svg" />
    <script src="script.js" defer></script>
    <title>Sign-up Form</title>
  </head>
  <body>
    <div class="image-section">
      <div class="title-bar">
        <img
          src="./assets/images/odin-linedSmall.png"
          alt="The Odin Project logo"
          id="odin-logo"
          height="203px"
          width="152px"
        />
        <h1>Odin</h1>
      </div>
      <img
        src="./assets/images/vikingShieldsSmall.jpg"
        alt="A pair of viking shields
        sitting under a tree"
        id="hero-picture"
        height="1275px"
        width="923px"
      />
    </div>
    <div class="signup-section">
      <h2>
        This is not a real service! You know you need something like this in
        your life to help you realise your deepest dreams. Sign up
        <em>now</em>
        to get started<br /><br />
        You <em>know</em> you want to.
      </h2>
      <form action="https://example.com">
        <div class="signup-form">
          <fieldset>
            <legend>Let's do this!</legend>
            <div class="input-row">
              <div class="input-section">
                <label for="first-name">FIRST NAME</label><br />
                <input type="text" name="first-name" id="first-name" />
              </div>
              <div class="input-section">
                <label for="last-name">LAST NAME</label><br />
                <input type="text" name="last-name" id="last-name" />
              </div>
            </div>
            <div class="input-row">
              <div class="input-section">
                <label for="email">EMAIL</label><br />
                <input type="email" name="email" />
              </div>
              <div class="input-section">
                <label for="phone">PHONE NUMBER</label><br />
                <input type="tel" name="phone" id="phone" />
              </div>
            </div>
            <div class="input-row">
              <div class="input-section">
                <label for="password">PASSWORD</label><br />
                <input type="password" name="password" id="password" />
              </div>
              <div class="input-section">
                <label for="confirm">CONFIRM PASSWORD</label><br />
                <input type="password" name="confirm" id="confirm" />
              </div>
            </div>
          </fieldset>
        </div>
        <button type="submit">Create Account</button>
      </form>
      <p>Already have an account? <a href="https://example.com">Log in</a></p>
    </div>
  </body>
</html>
