<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="./assets/images/vikingIcon.svg" />
    <script src="script.js" defer></script>
    <title>Sign-up Form</title>
  </head>
  <body>
    <div class="image-section">
      <div class="title-bar">
        <img
          src="./assets/images/odin-linedSmall.png"
          alt="The Odin Project logo"
          id="odin-logo"
          height="203px"
          width="152px"
        />
        <h1>Odin</h1>
      </div>
      <img
        src="./assets/images/vikingShieldsSmall.jpg"
        alt="A pair of viking shields
      sitting under a tree"
        height="1275px"
        width="923px"
      />
    </div>
    <div class="signup-section">
      <h2>
        This is not a real service! You know you need something like this in
        your life to help you realise your deepest dreams. Sign up <em>now</em>
        to get started
      </h2>
      <h2>You <em>know</em> you want to.</h2>
    </div>
    <form action="https://example.com">
      <fieldset>
        <legend>Let's do this!</legend>
        <label for="first-name">FIRST NAME</label>
        <input type="text" name="first-name" />
        <label for="last-name">LAST NAME</label>
        <input type="text" name="last-name" />
        <label for="email">EMAIL</label>
        <input type="email" name="email" />
        <label for="phone">PHONE NUMBER</label>
        <input type="tel" name="phone" />
        <label for="password">PASSWORD</label>
        <input type="password" name="password" />
        <label for="confirm">CONFIRM PASSWORD</label>
        <input type="password" name="confirm" />
      </fieldset>
      <button type="submit">Create Account</button>
      <p>Already have an account? <a href="https://example.com">Log in</a></p>
    </form>
  </body>
</html>
